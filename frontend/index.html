<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Control Académico</span>
    <nav>
      <a href="index.html" class="activo">Registro</a>
      <a href="consulta.html">Consulta</a>
    </nav>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h1>Registro de estudiantes</h1>
      <p class="sub">Todos los campos son obligatorios.</p>

      <div id="alerta" class="alerta oculto" role="alert"></div>

      <form id="formRegistro" novalidate>
        <div class="grid">
          <div class="campo">
            <label for="carne">Carné</label>
            <input type="text" id="carne" name="carne" maxlength="20" autocomplete="off"
                   placeholder="Ej. 20260001" required>
            <small class="error" id="error-carne"></small>
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" maxlength="150"
                   placeholder="usuario@dominio.com" required>
            <small class="error" id="error-correo"></small>
          </div>

          <div class="campo">
            <label for="nombres">Nombres</label>
            <input type="text" id="nombres" name="nombres" maxlength="100" placeholder="Ej. Juan Carlos" required>
            <small class="error" id="error-nombres"></small>
          </div>

          <div class="campo">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" maxlength="100" placeholder="Ej. Pérez López" required>
            <small class="error" id="error-apellidos"></small>
          </div>

          <div class="campo">
            <label for="carrera">Carrera</label>
            <select id="carrera" name="carrera" required>
              <option value="">-- Seleccione una carrera --</option>
            </select>
            <small class="error" id="error-carrera"></small>
          </div>

          <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" maxlength="9" inputmode="numeric"
                   placeholder="####-####" required>
            <small class="error" id="error-telefono"></small>
          </div>

          <div class="campo">
            <label for="fecha_nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            <small class="error" id="error-fecha_nacimiento"></small>
          </div>

          <fieldset class="campo">
            <legend>Género</legend>
            <div class="radios">
              <label><input type="radio" name="genero" value="Masculino" required> Masculino</label>
              <label><input type="radio" name="genero" value="Femenino"> Femenino</label>
              <label><input type="radio" name="genero" value="Otro"> Otro</label>
            </div>
            <small class="error" id="error-genero"></small>
          </fieldset>
        </div>

        <div class="campo captcha">
          <div id="recaptcha"></div>
          <small class="error" id="error-recaptcha_token"></small>
        </div>

        <div class="acciones">
          <button type="reset" class="btn secundario" id="btnLimpiar">Limpiar</button>
          <button type="submit" class="btn primario" id="btnEnviar" disabled>Registrar estudiante</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
